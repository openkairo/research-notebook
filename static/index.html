<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Research Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css?v=23">
</head>
<body>
<header class="kopf">
  <div class="kopf-innen">
    <button type="button" class="themen-knopf" id="themenKnopf" aria-controls="seitenleiste" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="themenAktiv"></span>
    </button>
    <div class="marke">
      <svg class="schleife" viewBox="0 0 32 40" aria-hidden="true"><path d="M8 5h17a2 2 0 0 1 2 2v26a2 2 0 0 1-2 2H8zM8 5a3 3 0 0 0-3 3v24a3 3 0 0 0 3 3M13 13h9M13 19h9M13 25h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <div class="marke-name" data-t="appName">Research Notebook</div>
        <div class="marke-unter" data-t="appSub"></div>
      </div>
    </div>
    <div class="kopf-rechts">
      <div class="sprachen" role="group" aria-label="Sprache / Language / Język">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pl">PL</button>
      </div>
      <button type="button" class="einst-knopf" id="einstKnopf" aria-pressed="false" aria-label="Einstellungen / Settings / Ustawienia" title="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="rahmen">
  <aside class="seitenleiste" id="seitenleiste" aria-label="Themen / Topics / Tematy">
    <div class="seite-kopf">
      <span class="eyebrow" data-t="topics">Themen</span>
      <button type="button" class="knopf klein primaer" data-act="topic-new" data-t="t_new">+ Thema</button>
    </div>
    <input type="search" id="themenSuche" autocomplete="off">
    <ul class="themen-liste" id="themenListe"></ul>
  </aside>
  <div class="spalte">
    <nav class="reiter" id="reiter"></nav>
    <main class="haupt">
      <div class="suchzeile">
        <input id="suche" type="search" autocomplete="off">
        <button type="button" class="knopf primaer" id="neuKnopf"></button>
      </div>
      <div id="inhalt"></div>
      <footer class="fuss">
        <p data-t="disclaimer"></p>
        <p><a href="/api/export" id="exportLink" data-t="export"></a></p>
      </footer>
    </main>
  </div>
</div>
<div class="leisten-schleier" id="leistenSchleier" hidden></div>

<div class="schleier" id="schleier" hidden>
  <form class="fenster" id="formular" novalidate>
    <div class="fenster-kopf">
      <h2 id="formTitel"></h2>
      <button type="button" class="x" id="formZu" aria-label="Schließen">×</button>
    </div>
    <div class="fenster-rumpf" id="formFelder"></div>
    <div class="fenster-fuss">
      <label class="haken"><input type="checkbox" id="uebersetzen" checked> <span data-t="autoTranslate"></span></label>
      <span class="status" id="formStatus"></span>
      <div class="knoepfe">
        <button type="button" class="knopf" id="formAbbruch" data-t="cancel"></button>
        <button type="submit" class="knopf primaer" id="formSpeichern" data-t="save"></button>
      </div>
    </div>
  </form>
</div>

<div class="spieler" id="spieler" hidden></div>
<button type="button" class="mark-knopf" id="markKnopf" hidden></button>
<aside class="erklaer-fenster" id="erklaerung" hidden aria-live="polite"></aside>
<div class="toast" id="toast" hidden></div>
<div class="zieh-hinweis" data-t="drop_here"></div>
<script src="/static/app.js?v=29"></script>
</body>
</html>
